name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 静态检查（脚本 / Python / JSON / TOML / SVG）
        run: |
          bash -n install.sh
          python - <<'PY'
          import ast, glob, json, pathlib, tomllib
          import xml.etree.ElementTree as ET

          for f in ("rq_mcp.py", "scripts/smoke_test.py", "scripts/unit_tests.py",
                    "scripts/merge_codex_toml.py"):
              ast.parse(pathlib.Path(f).read_text(encoding="utf-8"))

          # 防止一踩再踩：shell 里 $VAR 紧跟中文会被当成变量名的一部分（C locale 下直接报错）
          import re
          shell_bad = re.findall(r"\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7f]",
                                 pathlib.Path("install.sh").read_text(encoding="utf-8"))
          assert not shell_bad, f"变量后紧跟非 ASCII 字符，请改用 ${{VAR}}：{shell_bad[:5]}"

          files = (
              glob.glob("examples/*.json")
              + glob.glob("dsh-bundle/locale/*.json")
              + ["dsh-bundle/package.json"]
          )
          for f in files:
              json.load(open(f, encoding="utf-8"))
          tomllib.load(open("examples/codex.config.toml", "rb"))
          ET.parse("dsh-bundle/icon.svg")
          print(f"静态检查通过：{len(files)} 个 JSON + TOML + SVG")
          PY

      - name: 安装依赖
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --quiet --upgrade pip
          ./.venv/bin/python -m pip install --quiet -r requirements.txt

      - name: 单元测试（纯逻辑，不联网）
        run: ./.venv/bin/python scripts/unit_tests.py

      - name: MCP 协议冒烟测试
        run: ./.venv/bin/python scripts/smoke_test.py

      - name: 安装器冒烟测试（干净的 HOME）
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.codex" "$HOME/.workbuddy" "$HOME/.zcode" "$HOME/.dsh/profiles/ci"
          touch "$HOME/.dsh/profiles/ci/cordis.patch.yml"

          ./install.sh --no-login --client=all

          test -f "$HOME/.workbuddy/mcp.json"
          test -f "$HOME/.zcode/cli/config.json"
          grep -q "mcp_servers.rqrun" "$HOME/.codex/config.toml"
          grep -q "tool_timeout_sec" "$HOME/.codex/config.toml"
          grep -q "mcp-rqrun" "$HOME/.dsh/profiles/ci/cordis.patch.yml"

          # 幂等性：再跑一次不应产生重复条目
          ./install.sh --no-login --client=all
          test "$(grep -c 'mcp_servers.rqrun' "$HOME/.codex/config.toml")" = "1"
          test "$(grep -c 'id: mcp-rqrun' "$HOME/.dsh/profiles/ci/cordis.patch.yml")" = "1"
          echo "安装器冒烟测试通过"

      - name: ZCode 不得屏蔽已有的 .agents 服务（含"原生配置只有主题"的情况）
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.zcode/cli" "$HOME/.agents"
          printf '%s' '{"theme":"dark"}' > "$HOME/.zcode/cli/config.json"
          printf '%s' '{"mcpServers":{"existing":{"command":"echo"}}}' > "$HOME/.agents/mcp.json"

          ./install.sh --no-login --client=zcode

          python3 - <<'PY'
          import json, os
          home = os.environ["HOME"]
          zc = json.load(open(f"{home}/.zcode/cli/config.json"))
          ag = json.load(open(f"{home}/.agents/mcp.json"))
          assert zc.get("theme") == "dark", "主题等既有设置被破坏"
          assert not zc.get("mcp"), "不应往只含主题的原生配置里加 MCP"
          assert "existing" in ag["mcpServers"], "原有服务被丢弃"
          assert "rqrun" in ag["mcpServers"], "rqrun 未写入"
          print("ZCode：沿用 .agents，未屏蔽原有服务")
          PY

      - name: Codex 更新时不得破坏配置（行尾注释 / 用户自定义字段）
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.codex"
          printf '%s\n' \
            '[model]' 'name = "gpt-5"' '' \
            '[mcp_servers.rqrun] # existing' \
            'command = "/old/python"' \
            'args = [' '  "/old/rq_mcp.py",' ']' \
            'enabled = false' 'enabled_tools = ["a"]' '' \
            '[mcp_servers.other]' 'command = "x"' \
            > "$HOME/.codex/config.toml"

          ./install.sh --no-login --client=codex

          python3 - <<'PY'
          import os, tomllib
          p = f'{os.environ["HOME"]}/.codex/config.toml'
          text = open(p, encoding='utf-8').read()
          data = tomllib.loads(text)          # 必须仍是合法 TOML
          rq = data['mcp_servers']['rqrun']
          assert text.count('[mcp_servers.rqrun]') == 1, '重复定义了同一个表'
          assert rq['tool_timeout_sec'] == 600.0, '超时未更新'
          assert rq['args'] == [rq['args'][0]], 'args 未替换'
          assert rq.get('enabled') is False, '用户的 enabled=false 被删'
          assert rq.get('enabled_tools') == ['a'], '用户的 enabled_tools 被删'
          assert data['mcp_servers']['other']['command'] == 'x'
          assert data['model']['name'] == 'gpt-5'
          print('Codex：更新正确，用户设置保留')
          PY

      - name: 未安装 DSH 时不得异常退出
        run: |
          export HOME="$(mktemp -d)"          # 完全没有 ~/.dsh
          ./install.sh --no-login --client=all
          test ! -e "$HOME/.dsh"
          echo "未安装 DSH：正常跳过"

      - name: DSH 多 profile 时不得瞎写
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.dsh/profiles/alpha" "$HOME/.dsh/profiles/beta"
          touch "$HOME/.dsh/profiles/alpha/cordis.patch.yml" "$HOME/.dsh/profiles/beta/cordis.patch.yml"

          ./install.sh --no-login --client=dsh

          test "$(grep -c 'mcp-rqrun' "$HOME/.dsh/profiles/alpha/cordis.patch.yml")" = "0"
          test "$(grep -c 'mcp-rqrun' "$HOME/.dsh/profiles/beta/cordis.patch.yml")" = "0"

          DSH_PROFILE=nope ./install.sh --no-login --client=dsh
          test "$(grep -c 'mcp-rqrun' "$HOME/.dsh/profiles/alpha/cordis.patch.yml")" = "0"

          DSH_PROFILE=beta ./install.sh --no-login --client=dsh
          test "$(grep -c 'mcp-rqrun' "$HOME/.dsh/profiles/beta/cordis.patch.yml")" = "1"
          test "$(grep -c 'mcp-rqrun' "$HOME/.dsh/profiles/alpha/cordis.patch.yml")" = "0"
          echo "DSH：多 profile 跳过、指定不存在跳过、指定正确只写一个"
