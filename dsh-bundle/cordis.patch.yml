# ⚠️ 安装前请把下面两处路径改成你本机的实际绝对路径
- insert:
    - id: mcp-rqrun
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rqrun
        transport: stdio
        command: /绝对路径/rqrun-mcp/.venv/bin/python
        args:
          - /绝对路径/rqrun-mcp/rq_mcp.py
        cwd: /绝对路径/rqrun-mcp
        failOnStartupError: false
        toolCallTimeoutMs: 600000
